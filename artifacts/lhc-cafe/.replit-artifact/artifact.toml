kind = "web"
previewPath = "/"
title = "LHC Cafe"
version = "1.0.0"
id = "artifacts/lhc-cafe"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18096

[services.development]
run = "pnpm --filter @workspace/lhc-cafe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lhc-cafe", "run", "build" ]
publicDir = "artifacts/lhc-cafe/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18096"
BASE_PATH = "/"
